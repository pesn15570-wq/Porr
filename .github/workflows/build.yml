name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "ใช้ไฟล์: $ZIP"
          rm -rf proj && mkdir proj && unzip -q "$ZIP" -d proj
          S=$(find proj -name settings.gradle | head -1)
          echo "ROOT=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Build llama-server (arm64)
        run: |
          cd "$ROOT"
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          git clone --depth 1 --branch b9878 https://github.com/ggml-org/llama.cpp || git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"
          cmake --build build-android --target llama-server -j"$(nproc)"
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build-android/bin/llama-server
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$ROOT"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          cd "$ROOT"
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          {
            echo "## ผลตรวจ APK"
            echo '```'
            ls -l "$APK"
            unzip -tq "$APK"
            $BT/aapt2 dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk|application-label:|native-code"
            unzip -l "$APK" | grep -E "libllama_server|AndroidManifest.xml|classes.dex"
            $BT/apksigner verify --verbose "$APK" | head -8
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q libllama_server.so
          $BT/apksigner verify "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/rp-chat.apk"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" rp-chat.apk \
            --title "RP Chat build ${{ github.run_number }}" \
            --notes "โหลดไฟล์ rp-chat.apk แล้วติดตั้งได้เลย" \
            --target "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rp-chat-apk
          path: rp-chat.apk
          compression-level: 0
